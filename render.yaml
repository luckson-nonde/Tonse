# ---------------------------------------------------------------------------
# Tonse Hub — Render Blueprint (Infrastructure as Code)
#
# Provisions all three tiers as one deploy: managed Postgres, the NestJS API
# (Docker), and the Vite frontend (Static Site) — "Option A" from the runbook.
#
# How to use:
#   1. Commit this file and push it to the branch Render deploys (main).
#   2. Render dashboard → New → Blueprint → pick the tonsesupport-droid/Tonse repo.
#   3. Render reads this file, creates the services, and PROMPTS for every var
#      marked `sync: false` below (secrets it can't invent) — fill those in.
#   4. Apply. First backend boot runs the InitialSchema migration on the empty DB.
#
# Everything else (DB credentials, the two service URLs, JWT secrets) is wired
# automatically via fromDatabase / fromService / generateValue.
#
# NOTE: all three resources MUST share one region for private DB networking.
# `frankfurt` is Render's closest region to Zambia — change it in ALL places
# together if you prefer another. Plans are `free` to start; see upgrade notes.
# ---------------------------------------------------------------------------

databases:
  - name: tonse-db
    databaseName: tonse
    user: tonse
    region: frankfurt
    plan: free                 # free expires ~30 days; upgrade to `basic-256mb`+ for production
    postgresMajorVersion: "16"

services:
  # ---- Backend API (NestJS, Docker) --------------------------------------
  - type: web
    name: tonse-api
    runtime: docker
    region: frankfurt
    plan: free                 # free instances sleep when idle (cold starts); `starter` to keep warm
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # The one-off admin seed currently runs via backend/Dockerfile's CMD
    # (temporary — no Shell access on the free plan). Render's `dockerCommand`
    # override field mangled a `sh -c "a; b"` string (its exact
    # tokenization isn't documented), so the Dockerfile's own shell-form CMD
    # is used instead — that's standard, unambiguous Docker behavior.
    healthCheckPath: /categories/status
    numInstances: 1            # KEEP AT 1 — the live SSE notification registry is in-memory per process
    autoDeploy: true
    # ---- Persistent uploads (REQUIRED to keep files across deploys) --------
    # Without this the container filesystem is wiped on every redeploy/restart:
    # reference photos AND every encrypted KYC document (payslips, bank
    # statements, title deeds) are lost, so already-submitted loan requests
    # render as "unavailable".
    #
    # Render allows exactly ONE disk per service, so mount a single volume and
    # point both upload dirs at subpaths of it via UPLOADS_DIR /
    # SECURE_UPLOADS_DIR below (an earlier version of this block mounted only
    # /app/public/uploads, which silently left the secure documents ephemeral).
    #
    # Needs a PAID instance type — flip `plan: free` to `plan: starter` above,
    # then uncomment this block AND the two *_DIR env vars further down.
    # disk:
    #   name: proquote-uploads
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"           # main.ts honors it; matches the Dockerfile EXPOSE/healthcheck
      # --- Upload storage: uncomment TOGETHER with the `disk:` block above.
      #     Both must live under the single disk mountPath or uploads stay
      #     ephemeral. Unset, they fall back to the in-container paths.
      # - key: UPLOADS_DIR
      #   value: /var/data/uploads
      # - key: SECURE_UPLOADS_DIR
      #   value: /var/data/secure-uploads
      # --- Database (auto-wired from the managed Postgres above) ---
      - key: DB_HOST
        fromDatabase: { name: tonse-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: tonse-db, property: port }
      - key: DB_USERNAME
        fromDatabase: { name: tonse-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: tonse-db, property: password }
      - key: DB_NAME
        fromDatabase: { name: tonse-db, property: database }
      # --- Schema management: migrations, never synchronize, in production ---
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: DB_RUN_MIGRATIONS
        value: "true"           # first boot applies InitialSchema to the empty DB
      - key: DB_SSL
        value: no-verify        # Render's internal PG cert CN won't verify; TLS still on
      - key: DB_LOGGING
        value: "false"
      # --- Auth secrets (Render generates strong random values) ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 1h
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      # --- Field encryption (crypto-js). Enter EXACT lengths: KEY 32 chars, IV 16 chars ---
      - key: ENCRYPTION_KEY
        sync: false
      - key: ENCRYPTION_IV
        sync: false
      # --- At-rest PII encryption (AES-256-GCM). REQUIRED: the backend
      #     fail-closes and refuses to start in production without this.
      #     Set to base64 of 32 random bytes:
      #       node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - key: PII_ENCRYPTION_KEY
        sync: false
      # --- Web Push (VAPID). Generate once: `npx web-push generate-vapid-keys`.
      #     WEB_PUSH_PUBLIC_KEY must equal the frontend's VITE_VAPID_PUBLIC_KEY. ---
      - key: WEB_PUSH_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_SUBJECT
        value: mailto:ops@tonsehub.com
      # --- CORS: the frontend's PUBLIC origin. NOTE: Render's `fromService host`
      #     returns the private service name (e.g. `tonse-web`), not the public
      #     .onrender.com URL, so the browser-facing origin must be hardcoded.
      #     Update if you rename the static site or attach a custom domain. ---
      - key: CORS_ORIGINS
        value: https://tonse-web.onrender.com
      # --- Promoter programme ---
      - key: PROMOTER_INVITE_KEY
        sync: false
      - key: PROMOTER_APP_BASE_URL
        value: https://tonse-web.onrender.com
      # --- Platform admin seed. NOT read at app boot — only consumed by the
      #     manual `backend/src/database/seeds/seed.ts` script. Setting these
      #     here does NOT create the admin account by itself: after they're
      #     set, open the tonse-api service's Shell tab in the Render
      #     dashboard and run `npm run seed` once (add `-- --reset-password`
      #     to rotate an existing admin's password to the current value). ---
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false

  # ---- Frontend (React + Vite, Static Site + CDN) ------------------------
  - type: web
    name: tonse-web
    runtime: static
    # (no region — static sites are served on Render's global CDN)
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    # SPA fallback so React Router deep links resolve to the app shell.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # A few security headers (the Static Site has no nginx.conf CSP).
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Render doesn't know the .webmanifest extension and serves it as
      # binary/octet-stream. Harmless on its own, but with the nosniff header
      # above the browser won't second-guess that type, so the manifest can be
      # rejected — and no manifest means the app is not installable and
      # `beforeinstallprompt` never fires. Declare the real type explicitly.
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
    envVars:
      # Build-time (Vite bakes this in). The backend's PUBLIC URL — Render's
      # `fromService host` gives the private name `tonse-api`, which the browser
      # can't resolve, so the full URL is hardcoded. This is baked at build, so
      # changing it re-triggers a frontend build. Update on rename/custom domain.
      - key: VITE_API_URL
        value: https://tonse-api.onrender.com
      # MUST equal the backend's WEB_PUSH_PUBLIC_KEY (same VAPID public key).
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
      # Optional integrations — leave blank if unused.
      - key: GEMINI_API_KEY
        sync: false
      - key: LENCO_API_KEY
        sync: false

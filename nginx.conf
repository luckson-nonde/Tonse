# TONSE frontend nginx config: SPA static hosting + same-origin API proxy.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Base64 images are POSTed as large JSON bodies (backend allows 50mb).
    client_max_body_size 50m;

    # gzip for the static assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # API calls: strip the /api prefix and forward to the NestJS backend
    # (the backend mounts routes at the root, no global prefix), matching the
    # Vite dev-server rewrite `^/api -> ''`.
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Backend-hosted upload URLs are returned as /uploads/... (root-relative);
    # proxy them through the same origin so <img src="/uploads/..."> resolves.
    location /uploads/ {
        proxy_pass http://backend:3001/uploads/;
        proxy_set_header Host $host;
    }

    # SPA fallback: every unknown path serves index.html so react-router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted build assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

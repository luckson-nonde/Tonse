# ProQuote frontend nginx config: SPA static hosting + same-origin API proxy.
server {
    listen 80;
    server_name _;

    # Don't advertise the nginx version in the Server header / error pages.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Base64 images are POSTed as large JSON bodies (backend allows 50mb).
    client_max_body_size 50m;

    # Security headers.
    # script-src/style-src keep 'unsafe-inline' — index.html has a genuine
    # inline bootstrap <script> (fetch/globalThis shim) and the app sets
    # inline `style` attributes at runtime, so a stricter policy would break
    # the page. Moving that inline script to an external file would let this
    # be tightened to a nonce- or hash-based policy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    # HSTS only makes sense once this is actually served over TLS — enable
    # once a real cert is in front of this origin, not for plain-HTTP nginx.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # gzip for the static assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # API calls: strip the /api prefix and forward to the NestJS backend
    # (the backend mounts routes at the root, no global prefix), matching the
    # Vite dev-server rewrite `^/api -> ''`.
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Backend-hosted upload URLs are returned as /uploads/... (root-relative);
    # proxy them through the same origin so <img src="/uploads/..."> resolves.
    location /uploads/ {
        proxy_pass http://backend:3001/uploads/;
        proxy_set_header Host $host;
    }

    # SPA fallback: every unknown path serves index.html so react-router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted build assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

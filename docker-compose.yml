# Nyuwe full-stack local/demo orchestration.
#   frontend (nginx :3000) -> backend (NestJS :3001) -> postgres :5432
# Bring it up with:  docker compose up -d --build
#
# Secrets come from a root-level `.env` file (gitignored, read automatically
# by `docker compose` for the ${VAR} substitutions below): DB_PASSWORD,
# JWT_SECRET, JWT_REFRESH_SECRET, ENCRYPTION_KEY, ENCRYPTION_IV,
# PGADMIN_PASSWORD. Nothing sensitive is hardcoded in this file anymore;
# compose will refuse to start if a required var is missing.

services:
  postgres:
    # 15-alpine and 16-alpine are interchangeable for this app (TypeORM
    # synchronize + standard SQL). 15-alpine is pinned because the existing
    # local data volume (postgres_data) was initialized by Postgres 15 —
    # 16-alpine refuses to start on it ("database files are incompatible").
    # If you ever start from a FRESH volume, either version works.
    image: postgres:15-alpine
    container_name: tonse_postgres
    environment:
      POSTGRES_USER: tonse_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a root .env file}
      POSTGRES_DB: tonse_db
    ports:
      # Loopback-only — this only needs to be reachable from the host
      # machine (e.g. a local DB client), never from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tonse_user -d tonse_db']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: tonse_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- Database (points at the postgres service above) ---
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USERNAME: tonse_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a root .env file}
      DB_NAME: tonse_db
      # Required: this app has no migrations for the profile tables — TypeORM
      # `synchronize` creates the schema on boot. The categories seeder also
      # runs on boot (OnModuleInit) from catalog.json.
      DB_SYNCHRONIZE: 'true'
      DB_LOGGING: 'false'
      # NODE_ENV is intentionally NOT 'production': database.config.ts forces
      # DB SSL when NODE_ENV=production, but the bundled Postgres has no TLS.
      # For a managed SSL Postgres in real prod, set this to 'production'.
      NODE_ENV: development
      PORT: '3001'
      # --- Secrets — sourced from the root .env, never hardcoded here ---
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a root .env file (openssl rand -base64 48)}
      JWT_EXPIRATION: '3600s'
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in a root .env file (openssl rand -base64 48)}
      JWT_REFRESH_EXPIRATION: '604800s'
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in a root .env file}
      # At-rest PII encryption (AES-256-GCM). PROD: set to base64 of 32 random
      # bytes from a secrets manager / KMS, and rotate. Missing key in prod =
      # fail-closed (see common/crypto/pii-crypto.ts).
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?Set PII_ENCRYPTION_KEY (base64 of 32 random bytes) in a root .env file}
      ENCRYPTION_IV: ${ENCRYPTION_IV:?Set ENCRYPTION_IV in a root .env file}
    ports:
      - '3001:3001'
    volumes:
      # Persist uploaded files across container rebuilds.
      - backend_uploads:/app/public/uploads

  frontend:
    build:
      context: .
      args:
        # Same-origin: nginx proxies /api -> backend. See nginx.conf.
        VITE_API_URL: /api
    container_name: tonse_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3000:80'

  # Optional DB admin UI. Kept out of the default `up` (it is a large pull);
  # start it explicitly with:  docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tonse_pgadmin
    profiles: ['tools']
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tonse.marketplace
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in a root .env file}
    ports:
      - '127.0.0.1:5050:80'
    depends_on:
      - postgres
    # From the pgAdmin UI connect to host "postgres", port 5432.
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
  backend_uploads:

networks:
  default:
    name: tonse_network

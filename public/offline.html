<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <title>Tonse — You're offline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1b3068;
        background: radial-gradient(120% 140% at 85% -20%, rgba(201, 151, 58, 0.25), transparent 55%), #1b3068;
        font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #fff;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 360px; }
      .monogram {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(201, 151, 58, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 40px;
        font-weight: 700;
        color: #c9973a;
      }
      h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
      p { margin-top: 10px; font-size: 15px; line-height: 1.55; color: rgba(255, 255, 255, 0.72); }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c9973a;
        margin-right: 8px;
        animation: pulse 1.6s ease-in-out infinite;
        vertical-align: 1px;
      }
      @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      button {
        margin-top: 28px;
        padding: 12px 28px;
        border: none;
        border-radius: 999px;
        background: #c9973a;
        color: #1b3068;
        font-size: 15px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      button:active { transform: scale(0.97); }
      .hint { margin-top: 16px; font-size: 12.5px; color: rgba(255, 255, 255, 0.45); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="monogram">T</div>
      <h1>You're offline</h1>
      <p><span class="dot"></span>No internet connection right now. Tonse will reconnect automatically the moment you're back online — you stay signed in.</p>
      <button onclick="location.reload()">Try again</button>
      <p class="hint">Inquiries keep arriving on the server; you'll catch up as soon as you reconnect.</p>
    </div>
    <script>
      // The instant the connection returns, get back to the real app.
      window.addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
